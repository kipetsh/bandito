name: Check and deploy Pages

on:
  push:
    branches:
      - main
      - '**-chatgpt-check'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: npm run check && npm run test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm

      - name: Install locked dependencies
        id: dependencies
        run: npm ci

      - name: Create ChatGPT terminal snapshot
        if: github.event_name == 'push' && endsWith(github.ref_name, '-chatgpt-check')
        run: |
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/bandito-chatgpt-check-sha"
          tar -czf "$RUNNER_TEMP/bandito-chatgpt-check.tar.gz" \
            --exclude='./.git' \
            --exclude='./.tmp' \
            --exclude='./build' \
            -C "$GITHUB_WORKSPACE" . \
            -C "$RUNNER_TEMP" bandito-chatgpt-check-sha

      - name: Upload ChatGPT terminal snapshot
        if: steps.dependencies.outcome == 'success' && github.event_name == 'push' && endsWith(github.ref_name, '-chatgpt-check')
        uses: actions/upload-artifact@v4
        with:
          name: bandito-chatgpt-check
          path: ${{ runner.temp }}/bandito-chatgpt-check.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Run checks and tests
        run: npm run check && npm run test

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload production build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
