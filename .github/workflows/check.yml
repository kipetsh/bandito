name: Validate code

on:
  pull_request:
  workflow_run:
    workflows:
      - Deploy to GitHub Pages
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Code checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run npm run check
        run: npm run check

      - name: Run source tests
        run: npm run test:source

  build:
    name: Build and test production output
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Test production build
        run: npm run test:build
