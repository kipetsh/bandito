name: Frontend checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: frontend-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Check frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Inspect Prettier formatting
        run: |
          npx prettier --write css/blocks/challenge-editor.css js/challenge-editor.js
          git diff -- css/blocks/challenge-editor.css js/challenge-editor.js

      - name: Run code checks
        run: npm run check

      - name: Run tests and production build
        run: npm test
