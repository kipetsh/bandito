name: Frontend checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: frontend-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Check frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Format touched editor files
        run: npx prettier --write js/challenge-editor.js css/blocks/challenge-editor.css

      - name: Run code checks
        run: npm run check

      - name: Run tests and production build
        run: npm test

      - name: Commit formatter output and restore this workflow
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.before }}"
          git checkout FETCH_HEAD -- .github/workflows/frontend-checks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- js/challenge-editor.js css/blocks/challenge-editor.css .github/workflows/frontend-checks.yml
          git commit -m "Format challenge editor source and styles"
          git push origin HEAD:main
