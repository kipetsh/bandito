name: Format editor files once

on:
  push:
    branches:
      - main
    paths:
      - 'js/challenge-editor.js'
      - 'css/blocks/challenge-editor.css'
      - 'README.md'
      - 'AGENTS.md'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format changed files
        run: npx prettier --write js/challenge-editor.js css/blocks/challenge-editor.css README.md AGENTS.md
      - name: Check formatting
        run: npm run format:check
      - name: Check lint
        run: npm run lint
