name: Collect Prettier diagnostics

on:
  push:
    branches:
      - main
    paths:
      - 'js/challenge-editor.js'
      - 'css/blocks/challenge-editor.css'
      - 'README.md'
      - 'AGENTS.md'

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prettier report
        run: npx prettier --check --list-different --ignore-unknown . > prettier-report.txt 2>&1 || true
      - name: Publish report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'prettier-report.txt';
            const content = fs.readFileSync(path, 'utf8');
            const ref = await github.rest.git.getRef({ owner: context.repo.owner, repo: context.repo.repo, ref: 'heads/main' });
            const parent = ref.data.object.sha;
            const commit = await github.rest.git.getCommit({ owner: context.repo.owner, repo: context.repo.repo, commit_sha: parent });
            const blob = await github.rest.git.createBlob({ owner: context.repo.owner, repo: context.repo.repo, content, encoding: 'utf-8' });
            const tree = await github.rest.git.createTree({
              owner: context.repo.owner, repo: context.repo.repo,
              base_tree: commit.data.tree.sha,
              tree: [{ path, mode: '100644', type: 'blob', sha: blob.data.sha }]
            });
            const next = await github.rest.git.createCommit({
              owner: context.repo.owner, repo: context.repo.repo,
              message: 'Add temporary Prettier diagnostics',
              tree: tree.data.sha, parents: [parent]
            });
            await github.rest.git.updateRef({ owner: context.repo.owner, repo: context.repo.repo, ref: 'heads/main', sha: next.data.sha, force: false });
