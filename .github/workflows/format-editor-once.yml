name: Format and verify editor files once

on:
  push:
    branches:
      - main
    paths:
      - 'js/challenge-editor.js'
      - 'css/blocks/challenge-editor.css'
      - 'README.md'
      - 'AGENTS.md'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format changed files
        run: npx prettier --write js/challenge-editor.js README.md AGENTS.md .github/workflows/format-editor-once.yml
      - name: Check formatting
        run: npm run format:check
      - name: Check lint
        run: npm run lint
      - name: Commit formatted files and remove diagnostics
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const paths = ['js/challenge-editor.js', 'README.md', 'AGENTS.md', '.github/workflows/format-editor-once.yml'];
            const ref = await github.rest.git.getRef({ owner: context.repo.owner, repo: context.repo.repo, ref: 'heads/main' });
            const parent = ref.data.object.sha;
            const commit = await github.rest.git.getCommit({ owner: context.repo.owner, repo: context.repo.repo, commit_sha: parent });
            const tree = [];
            for (const path of paths) {
              const content = fs.readFileSync(path, 'utf8');
              const blob = await github.rest.git.createBlob({ owner: context.repo.owner, repo: context.repo.repo, content, encoding: 'utf-8' });
              tree.push({ path, mode: '100644', type: 'blob', sha: blob.data.sha });
            }
            tree.push({ path: 'lint-report.json', mode: '100644', type: 'blob', sha: null });
            tree.push({ path: 'prettier-report.txt', mode: '100644', type: 'blob', sha: null });
            const nextTree = await github.rest.git.createTree({
              owner: context.repo.owner, repo: context.repo.repo,
              base_tree: commit.data.tree.sha, tree
            });
            const nextCommit = await github.rest.git.createCommit({
              owner: context.repo.owner, repo: context.repo.repo,
              message: 'Format challenge editor source and documentation',
              tree: nextTree.data.sha, parents: [parent]
            });
            await github.rest.git.updateRef({
              owner: context.repo.owner, repo: context.repo.repo,
              ref: 'heads/main', sha: nextCommit.data.sha, force: false
            });
