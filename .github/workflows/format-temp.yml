name: Temporary Prettier formatter
on:
  push:
    branches:
      - main
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - run: npm ci
      - name: Format target files and emit contents
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import prettier from 'prettier';

          for (const file of ['js/challenge-editor.js', 'css/blocks/challenge-editor.css']) {
              const source = fs.readFileSync(file, 'utf8');
              const config = await prettier.resolveConfig(file);
              const formatted = await prettier.format(source, { ...config, filepath: file });
              console.log('PRETTIER_FILE:' + file + ':' + Buffer.from(formatted, 'utf8').toString('base64'));
          }
          NODE
