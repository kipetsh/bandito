name: ChatGPT branch tests

on:
  push:
    branches:
      - '**-chatgpt-check'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chatgpt-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run full test suite
        run: npm test
