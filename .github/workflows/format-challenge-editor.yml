name: Format challenge editor files

on:
  push:
    branches:
      - main
    paths:
      - 'js/challenge-editor.js'
      - 'css/blocks/challenge-editor.css'
      - 'README.md'
      - 'AGENTS.md'

permissions:
  contents: write

concurrency:
  group: format-challenge-editor
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format changed project files
        run: npx prettier --write js/challenge-editor.js css/blocks/challenge-editor.css README.md AGENTS.md
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/challenge-editor.js css/blocks/challenge-editor.css README.md AGENTS.md
          if ! git diff --cached --quiet; then
            git commit -m "Format challenge editor changes"
            git push
          fi
